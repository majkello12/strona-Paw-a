<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Przesuwanie modelu (wrażenie ruchu po osi X) przy scroll</title>

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html,body { height:100%; margin:0; font-family:system-ui,Segoe UI,Roboto,Arial; background:#111; color:#fff; }
    header { text-align:center; padding:28px 12px; }
    header small { display:block; color:#bbb; margin-top:6px; }

    /* daj dużo miejsca do scrolla żeby efekt był widoczny */
    .spacer { height:120vh; }

    model-viewer {
      width:100%;
      height:70vh;
      display:block;
      background: linear-gradient(180deg,#000,#0b0b0b);
    }

    footer { height:60vh; }
  </style>
</head>
<body>
  <header>
  </header>

  <div class="spacer"></div>

  <!-- UWAGA: zakoduj spacje w nazwie pliku jako %20 lub użyj bez spacji -->
  <model-viewer id="mv"
    src="malpki%20model%20wireframes.glb"
    alt="Model 3D"
    camera-controls
    auto-rotate
    environment-image="neutral"
    shadow-intensity="1"
    exposure="1.1"
    interpolation-decay="220"    <!-- płynne przejścia kamery -->
    camera-orbit="0deg 75deg 2.5m"
    camera-target="0m 0m 0m"
    loading="eager">
  </model-viewer>

  <div class="spacer"></div>
  <footer></footer>

  <script>
    const mv = document.getElementById('mv');

    // maksymalny przesuw w jednostkach metrycznych sceny (dostosuj)
    const MAX_X_METERS = 1.6;

    // rAF throttle
    let lastScroll = 0;
    let ticking = false;

    function onScroll() {
      lastScroll = window.scrollY;
      if (!ticking) requestAnimationFrame(updateCameraTarget);
      ticking = true;
    }

    function updateCameraTarget() {
      const docH = document.documentElement.scrollHeight;
      const winH = window.innerHeight;
      const maxScroll = Math.max(1, docH - winH);
      const progress = Math.min(1, Math.max(0, lastScroll / maxScroll)); // 0..1

      // mapujemy 0..1 -> -MAX_X..+MAX_X (środek strony => 0)
      const x = (progress * 2 - 1) * MAX_X_METERS;

      // ustawiamy camera-target (wartość w metrach, format: "Xm Ym Zm")
      mv.setAttribute('camera-target', `${x}m 0m 0m`);

      // niektóre przeglądarki/wersje interpolują inaczej — możesz wywołać updateFraming() jeśli potrzeba:
      // mv.updateFraming && mv.updateFraming();

      ticking = false;
    }

    // zainicjuj po załadowaniu modelu (i wykonaj pierwszą aktualizację)
    mv.addEventListener('load', () => {
      // początkowa aktualizacja (gdy model załadowany)
      updateCameraTarget();
    });

    // eventy
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', () => requestAnimationFrame(updateCameraTarget));
    // pierwsze uruchomienie też
    requestAnimationFrame(updateCameraTarget);
  </script>
</body>
</html>
