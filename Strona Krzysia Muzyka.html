  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 20px 50px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    .logo {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 2px;
    }

    nav {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 40px;
    }

    nav a {
      color: white;
      text-decoration: none;
            font-size: 1.1rem;

      font-weight: 600;
      position: relative;
      transition: color 0.3s;
    }

    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      background: #ff0066;
      left: 0; bottom: -4px;
      transition: width 0.3s;
    }

    nav a:hover::after {
      width: 100%;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 25px;
      height: 20px;
      cursor: pointer;
    }

    .hamburger span {
      display: block;
      height: 3px;
      background: white;
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }

    .nav-links {
      transition: max-height 0.5s ease;
    }

@media (max-width: 770px) {

  nav ul {
    position: fixed !important;
    top: 0 !important;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100vh;

    background: rgba(0, 0, 0, 0.93);
    backdrop-filter: blur(6px);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;

    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;

    z-index: 9998;
    transition: transform 0.45s ease, opacity 0.45s ease;
  }

  nav ul.show {
    transform: translateY(0);
    opacity: 1;
    pointer-events: all;
  }

  .hamburger {
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    z-index: 9999; /* ponad menu */
    position: relative;
  }

  .hamburger span {
    width: 30px;
    height: 3px;
    background-color: white;
    border-radius: 2px;
    transition: 0.3s ease;
  }

  .hamburger.active span:nth-child(1) {
    transform: translateY(9px) rotate(45deg);
  }
  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }
  .hamburger.active span:nth-child(3) {
    transform: translateY(-9px) rotate(-45deg);
  }

  nav ul li a {
    color: white;
    font-size: 2rem;
    text-decoration: none;
    transition: 0.3s ease;
    opacity: 0;
    transform: translateY(20px);
  }

  nav ul.show li a {
    opacity: 1;
    transform: translateY(0);
  }

  nav ul.show li:nth-child(1) a { transition-delay: 0.1s; }
  nav ul.show li:nth-child(2) a { transition-delay: 0.2s; }
  nav ul.show li:nth-child(3) a { transition-delay: 0.3s; }
  nav ul.show li:nth-child(4) a { transition-delay: 0.4s; }

  nav ul li a:hover {
    color: #f1c40f;
    transform: scale(1.1);
  }
}

<script>
  const hamburger = document.getElementById('hamburger');
  const navUl = document.querySelector('nav ul');

  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    navUl.classList.toggle('show');
  });

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
        } else {
          entry.target.classList.remove('show');
        }
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('.bio, .social').forEach(el => observer.observe(el));
  </script>


<script>
const PL_SHORT_WORDS = [
  "i", "a", "o", "u", "w", "z",
  "do", "na", "za", "po", "od", "bez",
  "ku", "we"
];

function fixPolishTypography(selector) {
  document.querySelectorAll(selector).forEach(el => {
    let text = el.innerHTML;

    PL_SHORT_WORDS.forEach(word => {
      const regex = new RegExp(`\\b${word} `, "gi");
      text = text.replace(regex, match => match.trim() + "&nbsp;");
    });

    text = text.replace(/ (\S+)$/, "&nbsp;$1");

    el.innerHTML = text;
  });
}

fixPolishTypography(".bio-text p");
</script>

<script>
const hamburger = document.getElementById("hamburger");
const navUL = document.querySelector("nav ul");
const links = document.querySelectorAll("nav ul li a");

hamburger.addEventListener("click", () => {
  hamburger.classList.toggle("active");
  navUL.classList.toggle("show");
});

links.forEach(link => {
  link.addEventListener("click", () => {
    hamburger.classList.remove("active");
    navUL.classList.remove("show");
  });
});
</script>
