<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Przesuwanie modelu (wrażenie ruchu po osi X) przy scroll</title>

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html,body { height:100%; margin:0; font-family:system-ui,Segoe UI,Roboto,Arial; background:#111; color:#fff; }
    header { text-align:center; padding:28px 12px; }
    header small { display:block; color:#bbb; margin-top:6px; }

    .spacer { height:120vh; }

    model-viewer {
      width:100%;
      height:70vh;
      display:block;
      background: linear-gradient(180deg,#000,#0b0b0b);
    }

    footer { height:60vh; }
  </style>
</head>
<body>
  <header>
  </header>

  <div class="spacer"></div>

  <model-viewer id="mv"
    src="malpki%20model%20wireframes.glb"
    alt="Model 3D"
    camera-controls
    auto-rotate
    environment-image="neutral"
    shadow-intensity="1"
    exposure="1.1"
    interpolation-decay="220"    
    camera-orbit="0deg 75deg 2.5m"
    camera-target="0m 0m 0m"
    loading="eager">
  </model-viewer>

  <div class="spacer"></div>
  <footer></footer>

  <script>
const mv = document.getElementById('mv');

const MAX_Z_METERS = 33;  

let lastScroll = 0;
let ticking = false;

function onScroll() {
  lastScroll = window.scrollY;
  if (!ticking) requestAnimationFrame(updateCameraTarget);
  ticking = true;
}

function updateCameraTarget() {
  const docH = document.documentElement.scrollHeight;
  const winH = window.innerHeight;
  const maxScroll = Math.max(1, docH - winH);
  const progress = Math.min(1, Math.max(0, lastScroll / maxScroll)); // 0..1

  // mapujemy 0..1 -> -MAX_Z..+MAX_Z (środek strony => 0)
  const z = (progress * 2 - 1) * MAX_Z_METERS;

  // ustawiamy camera-target w osi Z zamiast X
  mv.setAttribute('camera-target', `0m 0m ${z}m`);

  ticking = false;
}

// inicjalizacja po załadowaniu modelu
mv.addEventListener('load', () => {
  updateCameraTarget();
});

window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', () => requestAnimationFrame(updateCameraTarget));
requestAnimationFrame(updateCameraTarget);  </script>
</body>
</html>
