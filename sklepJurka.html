.frame-section {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 3 kolumny na dużych ekranach */
  gap: 20px; /* odstęp między ramkami */
  justify-items: center; /* wyśrodkowanie ramek w kolumnach */
  padding: 40px;
}

.frame {
  width: 300px;
  height: 300px;
  border: 9px solid #990707;
  background-color: #7777773f;
  overflow: hidden;  
  position: relative;
  transition: transform 0.2s;
    aspect-ratio: 1 / 1; /* kwadrat */

}


.frame-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.1s linear;
}

.frame:hover {
  transform: scale(1.03);
}

.frame-text {
  font-family: Noto Serif;
  text-transform: uppercase;
  font-size: clamp(26px, 4vw, 37px); 
  color: #990707;
  font-weight: 700;
  margin-bottom: 40px; 
  text-align: center;
  transition: transform 0.3s, text-shadow 0.3s;
}

.frame-text:hover {
  transform: scale(1.03);
  text-shadow: 0 0 8px #fff;
}

/* Małe ekrany: pojedyncza kolumna */

  .frame-section {

<script>
    const layers = document.querySelectorAll(".layer");

    layers.forEach(layer => {
        const w = layer.dataset.width;
        const x = layer.dataset.x;
        const y = layer.dataset.y;
        const z = layer.dataset.z || 0;
        layer.style.width = w + "px";
        layer.style.left = "50%";
        layer.style.top = "50%";
        layer.style.zIndex = z;
        layer.style.transform = `translate(calc(${x}% - 50%), calc(${y}% - 50%))`;
    });

    window.addEventListener("load", () => {
        layers.forEach((layer, index) => {
            setTimeout(() => {
                layer.classList.add("show");
            }, index * 500);
        });
    });

    window.addEventListener("scroll", () => {
        const scrollTop = window.scrollY;
        layers.forEach(layer => {
            const speed = parseFloat(layer.dataset.speed);
            const x = layer.dataset.x;
            const y = layer.dataset.y;
            layer.style.transform = `translate(calc(${x}% - 50%), calc(${y}% - 50% + ${scrollTop / speed}px))`;
        });
    });

    const video = document.getElementById("myVideo");
    function playPause() {
        if (video.style.display === "none") video.style.display = "block";
        if (video.paused) {video.play();} else {video.pause();}
    }
    function muteUnmute() {
        video.muted = !video.muted;
    }

    const hamburger = document.getElementById("hamburger");
    const navLeft = document.getElementById("nav-left");
    const navRight = document.getElementById("nav-right");
    hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        navLeft.classList.toggle("show");
        navRight.classList.toggle("show");
    });
</script>
<script>
const frames = document.querySelectorAll('.frame');

window.addEventListener('scroll', () => {
  frames.forEach(frame => {
    const image = frame.querySelector('.frame-image');
    const rect = frame.getBoundingClientRect();
    const speed = 0.15; // prędkość przesunięcia

    // offset względem górnej krawędzi okna
    const offset = rect.top * speed;

    image.style.transform = `translateY(${offset}px) scale(1)`; 
  });
});
</script>
