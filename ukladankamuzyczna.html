<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Piano Studio v4.1</title>

<style>
body{
margin:0;
background:#0a0a0c;
color:white;
font-family:Segoe UI;
text-align:center;
overflow:hidden;
}

/* ===== TOP PIANO ===== */
.keyboard{
display:flex;
justify-content:center;
gap:2px;
padding:8px;
background:#111;
position:sticky;
top:0;
}

.key{
width:40px;
height:120px;
background:#f2f2f2;
color:black;
font-size:10px;
display:flex;
align-items:flex-end;
justify-content:center;
padding-bottom:6px;
cursor:pointer;
transition:0.12s;
border-radius:0 0 6px 6px;
user-select:none;
}

.key.black{
width:26px;
height:80px;
background:#111;
color:white;
margin-left:-13px;
margin-right:-13px;
z-index:2;
}

/* animation FIX */
.key.active{
transform:scale(0.92);
box-shadow:0 0 20px #d4af37;
background:#d4af37 !important;
color:black;
}

/* ===== LAYOUT ===== */
.container{
display:flex;
justify-content:center;
gap:8px;
padding:8px;
}

/* LEFT PANEL HIGHER (FIX) */
.palette{
background:#151518;
padding:10px;
border-radius:12px;
width:180px;
align-self:flex-start;
margin-top:-10px;
}

.board{
width:320px;
display:grid;
grid-template-columns:repeat(8,1fr);
gap:3px;
}

.panel{
background:#151518;
padding:10px;
border-radius:12px;
width:180px;
}

.slot{
height:28px;
font-size:10px;
background:#1e1e22;
border:1px dashed #333;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.slot.filled{
background:#d4af3722;
border-color:#d4af37;
}

/* notes */
.note{
font-size:10px;
padding:3px;
margin:2px;
background:#222;
border-radius:6px;
cursor:grab;
}

/* buttons */
button,select{
width:100%;
margin:3px 0;
padding:6px;
border:none;
border-radius:8px;
background:#d4af37;
color:black;
cursor:pointer;
font-weight:600;
}

/* wave */
canvas{
width:100%;
height:90px;
background:black;
border-radius:10px;
margin-top:6px;
}
</style>
</head>

<body>

<h3>🎹 Piano Studio v4.1 FIX</h3>

<!-- PIANO -->
<div class="keyboard" id="keyboard"></div>

<div class="container">

<div class="palette" id="palette"></div>

<div class="board" id="board"></div>

<div class="panel">

<select id="mode">
<option value="chord">Chord</option>
<option value="up">Up</option>
<option value="down">Down</option>
</select>

<button onclick="playBoard()">▶ Play</button>
<button onclick="detect()">🧠 Detect</button>
<button onclick="reset()">🔄 Reset</button>

<div id="result"></div>
<canvas id="wave"></canvas>
</div>

</div>

<script>

// ================= AUDIO ENGINE FIX =================
const ctx = new (window.AudioContext || window.webkitAudioContext)();

document.body.addEventListener("click",()=>ctx.resume());

function play(freq){

const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.type="sawtooth";
osc.frequency.value=freq;

gain.gain.setValueAtTime(0,ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.9,ctx.currentTime+0.01);
gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+1);

osc.connect(gain);
gain.connect(ctx.destination);

osc.start();
osc.stop(ctx.currentTime+1);
drawWave();
}

// ================= NOTES =================
const keys=[
["C4",261.63],["C#4",277.18],
["D4",293.66],["D#4",311.13],
["E4",329.63],
["F4",349.23],["F#4",369.99],
["G4",392.00],["G#4",415.30],
["A4",440.00],["A#4",466.16],
["B4",493.88]
];

// ================= KEYBOARD + ANIMATION FIX =================
const keyboard=document.getElementById("keyboard");

keys.forEach(([n,f])=>{
const k=document.createElement("div");
k.className=n.includes("#")?"key black":"key";
k.innerText=n;

k.onclick=()=>{
k.classList.add("active");
setTimeout(()=>k.classList.remove("active"),150);
play(f);
};

keyboard.appendChild(k);
});

// ================= BOARD =================
const board=document.getElementById("board");

for(let i=0;i<16;i++){
const s=document.createElement("div");
s.className="slot";

s.ondragover=e=>e.preventDefault();

s.ondrop=e=>{
const n=e.dataTransfer.getData("text");
s.dataset.note=n;
s.innerText=n;
s.classList.add("filled");
};

s.onclick=()=>{
s.dataset.note="";
s.innerText="";
s.classList.remove("filled");
};

board.appendChild(s);
}

// ================= PALETTE (HIGHER LEFT FIX) =================
const palette=document.getElementById("palette");

keys.forEach(([n])=>{
const d=document.createElement("div");
d.className="note";
d.draggable=true;
d.innerText=n;
d.ondragstart=e=>e.dataTransfer.setData("text",n);
palette.appendChild(d);
});

// ================= PLAY FIX =================
function playBoard(){

let arr=[...document.querySelectorAll(".slot")]
.map(s=>s.dataset.note)
.filter(Boolean);

const mode=document.getElementById("mode").value;

if(mode==="down") arr=arr.reverse();

if(mode==="chord"){
arr.forEach(n=>{
const f=keys.find(k=>k[0]===n)?.[1];
if(f) play(f);
});
return;
}

let i=0;
function next(){
if(i>=arr.length) return;
const f=keys.find(k=>k[0]===arr[i])?.[1];
if(f) play(f);
i++;
setTimeout(next,200);
}
next();
}

// ================= CHORD LIBRARY EXPANDED =================
const CHORDS={
"C":["C","E","G"],
"C7":["C","E","G","A#4"],
"Cmaj7":["C","E","G","B"],
"C6":["C","E","G","A"],
"Cm":["C","D#","G"],
"Cm7":["C","D#","G","A#4"],
"Cdim":["C","D#","F#"],
"Caug":["C","E","G#"],
"Csus2":["C","D","G"],
"Csus4":["C","F","G"],

"Am":["A","C","E"],
"Am7":["A","C","E","G"],

"Dm":["D","F","A"],
"Dm7":["D","F","A","C"],

"G":["G","B","D"],
"G7":["G","B","D","F"],

"F":["F","A","C"],
"Fmaj7":["F","A","C","E"]
};

// ================= DETECT =================
function norm(n){return n.replace(/[0-9]/g,"");}

function detect(){

const input=[...document.querySelectorAll(".slot")]
.map(s=>s.dataset.note)
.filter(Boolean)
.map(norm);

const uniq=[...new Set(input)].sort();

let res=[];

for(const [name,ch] of Object.entries(CHORDS)){
const normCh=ch.map(norm).sort();

if(normCh.length===uniq.length &&
normCh.every(v=>uniq.includes(v))){
res.push(name);
}
}

document.getElementById("result").innerText=
res.length?"🎼 "+res.join(" / "):"❓ no match";
}

// ================= RESET =================
function reset(){
document.querySelectorAll(".slot").forEach(s=>{
s.dataset.note="";
s.innerText="";
s.classList.remove("filled");
});
}

// ================= OSCILLOSCOPE =================
const canvas=document.getElementById("wave");
const c=canvas.getContext("2d");

function drawWave(){
let t=0;
function draw(){
c.clearRect(0,0,canvas.width,canvas.height);
c.beginPath();

for(let x=0;x<canvas.width;x++){
let y=45+Math.sin(x*0.04+t)*18;
c.lineTo(x,y);
}

c.strokeStyle="#d4af37";
c.stroke();

t+=0.25;
requestAnimationFrame(draw);
}
draw();
}
</script>

</body>
</html>
